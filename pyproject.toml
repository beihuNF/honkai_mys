[project]
name = "honkai-mys"
version = "0.1.0"
description = "Honkai Impact 3rd Miyoushe Helper"
authors = [
    {name = "beihuNF", email = "none"},
]
dependencies = [
    "httpx>=0.23.0",
    "Pillow>=9.0.0",
    "pydantic>=1.10.0",
    "sqlitedict>=2.0.0",
    "pyyaml>=6.0",
    "nonebot2>=2.0.0",
    "nonebot-adapter-onebot>=2.0.0",
]
requires-python = ">=3.8"
license = {text = "MIT"}
readme = "README.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modules"]
